<!DOCTYPE html>
<!-- WHAT THIS FILE DOES: The shared page frame (title bar, menu links and Log out button) that other pages fill in.
     WHO CAN USE IT: Both (every page after login). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Stinablis Tracker{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
</head>
<body>
  <div class="topbar">
    <strong>Stinablis Tracker</strong>
    {% if current_user %}
    <form method="post" action="{{ url_for('auth.logout') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <span>{{ current_user['username'] }} ({{ current_user['role']|lower }})</span>
      <button type="submit">Log out</button>
    </form>
    {% endif %}
  </div>
  {% if current_user %}
  <nav class="menu" aria-label="Main menu">
    <a href="{{ url_for('home') }}">Home</a>
    <a href="{{ url_for('materials.list_materials') }}">Materials</a>
    <a href="{{ url_for('suppliers.supplier_list') }}">Suppliers</a>
    <a href="{{ url_for('stats.statistics_page') }}">Statistics</a>
    {% if can_manage_users(current_user) %}<a href="{{ url_for('users.list_users') }}">Users</a>{% endif %}
  </nav>
  {% endif %}
  <div class="content">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
