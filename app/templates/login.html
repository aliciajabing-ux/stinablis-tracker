<!DOCTYPE html>
<!-- WHAT THIS FILE DOES: The login screen (username, password, Log in button).
     WHO CAN USE IT: Everyone who is not logged in yet. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in - Stinablis Tracker</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f2f4f7; margin: 0; padding: 16px; }
    .box { max-width: 380px; margin: 40px auto; background: #fff; padding: 24px; border-radius: 8px;
           box-shadow: 0 1px 4px rgba(0,0,0,.15); }
    h1 { margin-top: 0; font-size: 1.5rem; }
    .help { color: #444; margin-bottom: 16px; }
    label { display: block; font-weight: bold; margin-top: 12px; }
    input { width: 100%; box-sizing: border-box; padding: 12px; font-size: 1rem; margin-top: 4px; }
    button { width: 100%; margin-top: 20px; padding: 14px; font-size: 1.1rem; background: #1a5fb4;
             color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
    .error { background: #fde8e8; color: #8a1c1c; padding: 10px; border-radius: 6px; margin-bottom: 8px; }
  </style>
  <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap">
</head>
<body>
  <div class="box">
    <h1>Log in</h1>
    <p class="help">Type your username and password to open the stock tracker.</p>
    {% if message %}
      <div class="error" role="alert">{{ message }}</div>
    {% endif %}
    <form method="post" action="{{ url_for('auth.login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" value="{{ username }}"
             maxlength="100" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password"
             maxlength="200" autocomplete="current-password" required>
      <button type="submit">Log in</button>
    </form>
  </div>
</body>
</html>
